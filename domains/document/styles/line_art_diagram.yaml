  - "细腻排线更倾向只出现在章节小插画里，还是也接受概念图的少量局部排线？"
  - "一处点睛色更倾向灰金、灰青，还是随主卡强调色调整，在已有数据编码时是否接受省去装饰色？"
  - "与暗色主卡搭配时，更倾向浅色线条直接落在暗底，还是放进与正文分隔的浅色图框？"
