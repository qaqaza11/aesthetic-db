name: 线稿器物静物
domain: illustration
version: 1
summary: "以细线器物、轻浅投影与充足留白，为短文提供低注意力的日常情境说明。"
use_when: 为阅读、饮茶、听歌、居家或工作片段的短文制作段间与侧栏配图，文字需要可辨认的器物或小场景作为辅助说明时。
likes:
  - item: "人物/环境/信息关系：倾向由茶杯、书、耳机等器物对应段落中的具体活动，桌面或窗边说明使用情境；人物通常隐于画外，其存在通过使用痕迹被感知。"
    weight: 0.55
    source: ai_drafted
    since: "2026-10-19"
  - item: "技法质感：倾向以纤细轮廓和顺应曲面的短排线画出杯口椭圆、书页厚度与耳机弧线，让器物结构易读，线条疏密体现手绘感。"
    weight: 0.5
    source: ai_drafted
    since: "2026-10-19"
  - item: "细节分配：倾向保留杯沿反光、折角书页、织物包边与耳罩缝线等可辨的小细节，细节聚在使用接触处，周围以开放留白承接正文。"
    weight: 0.55
    source: ai_drafted
    since: "2026-10-19"
  - item: "色彩倾向：通常以黑白线条为底，低饱和茶褐、灰绿或旧金可落在杯内、书签和小配件，点睛色可多可少，也可保持纯黑白。"
    weight: 0.45
    source: ai_drafted
    since: "2026-10-19"
  - item: "光照：倾向用左上方近中性的柔和窗光照向器物，受光边缘以纸白或断线表示，右下方软投影与底部稍密排线说明物体落在桌面上，整体反差较低。"
    weight: 0.45
    source: ai_drafted
    since: "2026-10-19"
  - item: "空间层次：前景一小段桌沿建立观看位置，中景一件主器物与少量相关物件相互遮挡，远景窗框或墙角以疏线淡出，倾向通过遮挡和线条疏密呈现较浅的空间纵深。"
    weight: 0.5
    source: ai_drafted
    since: "2026-10-19"
  - item: "故事感：倾向呈现阅读暂歇或刚放下耳机的短暂停顿，以半开的书、尚有热气的杯子或松开的线缆暗示片刻前的活动，叙事浓度通常较轻。"
    weight: 0.45
    source: ai_drafted
    since: "2026-10-19"
  - item: "视觉注意力：倾向让器物轮廓在文章版面中容易辨认，同时保持较小的深色覆盖面积与充足边缘留白，作为正文旁的辅助说明和阅读停顿。"
    weight: 0.5
    source: ai_drafted
    since: "2026-10-19"
dislikes: []
hard_constraints: []
soft_preferences: []
references_positive: []
references_negative: []
prompt_semantics: >-
  倾向以纤细手绘轮廓和顺应曲面的短排线描绘茶杯、书、耳机或窗边小场景，清楚交代器物结构，在杯沿、页角和缝线处保留细腻细节。色彩通常以黑白为底，茶褐、灰绿或旧金等低饱和点睛色可多可少，也可保持纯黑白。光照设想为左上方近中性的柔和窗光，受光边缘借纸白或断线呈现，右下方的软投影与底部稍密排线交代落地关系，整体反差较低。空间层次可由前景短桌沿、中景主器物与少量相关物件、远景疏线窗框和开放留白组成，物体遮挡提供浅层纵深。故事感通常落在阅读暂歇或刚放下耳机的时刻，书页、杯中热气和线缆状态暗示刚才的活动。器物对应文章中的具体信息，环境补充使用情境，人物通常隐于画外；画面在版面中承担辅助说明，以较小深色覆盖面积和充足留白维持轻量的视觉注意力。
notes:
  - "分类维度参考Adobe Spectrum（https://spectrum.adobe.com/foundations/visual-language/illustration），借用线性插画对应较低视觉注意力的思路，将其迁移为正文旁的辅助说明角色。"
  - "分类维度参考Art in Context（https://artincontext.org/types-of-illustration/），借用技法与用途分开组织的思路，将排线技法与日常配图用途分别记录。"
  - "低注意力的版面角色是本批对 Spectrum 思路的应用推断；细腻排线与留白承接 wallpaper 偏好并降权，点睛色数量与无人使用痕迹为待确认变体。"
  - 2026-10-19 用户审阅 AI 生成的 illustration 预览对照图（8 张）后确认本卡入库（选中第 7 张）
pending_confirmation:
  - "器物题材更常见于茶与阅读、音乐设备、工作桌面还是其他日常活动？希望更偏精确结构还是手绘概括？"
  - "更偏单件器物、两三件相关物件，还是能看见桌面与窗边的小场景？是否希望偶尔出现正在使用器物的手？"
  - "故事感希望接近静态说明，还是保留杯中热气、翻开的书等刚被使用过的线索？"
  - "配色更偏纯黑白、单处低饱和点色，还是几处轻微呼应的颜色？段间图与文章主视觉哪一种使用更多？"
