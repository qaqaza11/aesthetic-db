name: 国风境物
domain: illustration
version: 1
summary: "以东方山水、建筑与器物为叙事主体，用厚涂材质、空间递进和使用痕迹承载文章的时间感与主题。"
use_when: >-
  为写景散文、器物随笔，以及关于记忆、流逝、归途或栖居的文章制作 AI 配图，适合让地点与物件承接文字主题；
  可展开为山水建筑场景，也可收近为器物特写或静物，人物可少可无，出现时通常交代尺度或使用关系。
likes:
  - item: "技法质感：倾向将国风厚涂延伸到山石、木构、陶瓷与铜器，用叠色和可辨笔触塑造体积，在漆面反光、釉色过渡与石面颗粒处增加细节。"
    weight: 0.57
    source: ai_drafted
    since: "2026-10-19"
  - item: "人物／环境／信息关系：倾向把文字主题落在具体境物上，如以旧院与新芽表达时间推移、以空泊渡口表达归途；空间和器物承载主要信息，人物通常提供尺度、行迹或使用线索。"
    weight: 0.54
    source: ai_drafted
    since: "2026-10-19"
  - item: "器物细节：倾向细画木纹磨亮处、铜器氧化色、陶瓷细裂纹、织物纤维及修补接缝，按器物实际材质选择纹理，让细节提示被使用、被保存或被遗落的经历。"
    weight: 0.55
    source: ai_drafted
    since: "2026-10-19"
  - item: "境物安排：倾向让台阶通向门扉、溪流绕过旧屋、杯盏与展开的书页相邻，以路径、遮挡和物件间距串起线索；器物数量可多可少，组合围绕文章主题展开。"
    weight: 0.49
    source: ai_drafted
    since: "2026-10-19"
  - item: "故事感：倾向表现事情发生后的余温或到来前的等待，如人去后的温茶、雨停后的积水、尚未合上的门；蒸汽、落叶堆积或斜移的日影让静物与空景带出时间。"
    weight: 0.48
    source: ai_drafted
    since: "2026-10-19"
  - item: "空间层次：场景通常由前景石阶、枝叶或岸边器物，中景庭院、建筑或水面，远景山峦与雾带递进；器物近景可对应为前景桌沿、中景主器物和后方屏风，让重叠、尺度与反差变化提供纵深。"
    weight: 0.52
    source: ai_drafted
    since: "2026-10-19"
  - item: "光照：倾向让偏暖的低角度日光从画面一侧掠过屋檐、石阶或器物表面，投下可辨方向的长影；阴影由偏冷天光补足，近处纹理明暗清楚，远处经薄雾减弱反差。"
    weight: 0.44
    source: ai_drafted
    since: "2026-10-19"
  - item: "色彩：倾向以矿物青绿、暖赭、木色与瓷白形成中低饱和主体色，在漆器、印泥或屋檐细部安排少量朱砂，使材质本色与时间痕迹容易辨认。"
    weight: 0.43
    source: ai_drafted
    since: "2026-10-19"
  - item: "视觉注意力：倾向把最密的纹理和最清楚的轮廓留给主题器物或关键建筑节点，再以水纹、屋脊和道路引导阅读；点景人物可用小尺度剪影与简洁动作融入路径。"
    weight: 0.5
    source: ai_drafted
    since: "2026-10-19"
dislikes: []
hard_constraints: []
soft_preferences: []
references_positive: []
references_negative: []
prompt_semantics: >-
  从文章的记忆、流逝、归途或栖居主题中提取一组具体境物，让环境与器物承担主要信息，画面可选取东方山水、院落建筑、桌案静物或器物特写；
  人物可少可无，出现时通常作为尺度、使用行为或远去行迹的线索。
  技法倾向国风数字厚涂，用层叠色块、可见笔触和精细材质刻画木纹、石面、瓷釉与铜器，丰富细节集中在与主题有关的磨损、修补与摆放关系上。
  色彩倾向矿物青绿、暖赭、木色及瓷白，局部以朱砂点出主器物或关键建筑细节。
  光照倾向偏暖的低角度侧向日光掠过材质表面，形成方向清楚的长影，阴影接受偏冷天光；远处经薄雾逐步降低明暗反差。
  空间按画面尺度组织：广景由前景石阶或枝叶通向中景庭院和水面，再延伸到远景山峦；器物近景由前景桌沿引向中景器物，再由后方屏风或窗景交代所在空间。
  故事感倾向取自雨后积水、仍有蒸汽的茶盏或半开的门所提示的事件前后，让观者从境物的状态读出时间，并把这些线索联系到文字主题。
notes:
  - "分类维度参考 Art in Context（https://artincontext.org/types-of-illustration/）：将数字绘画技法、文章配图用途与境物叙事焦点分别考虑，使同一厚涂母系可用于广景和器物近景。"
  - "分类维度参考 Adobe Firefly 风格预设（https://developer.adobe.com/firefly-services/docs/firefly-api/guides/concepts/style-presets/）：借用 muted_color 与光照类别作为可观察维度，具体色组、侧光与长影为低权重草拟方向。"
  - "分类维度参考 Adobe Spectrum（https://spectrum.adobe.com/foundations/visual-language/illustration）：借鉴插画的视觉注意力层级；将纹理与局部反差集中到主题境物，是本卡对该思路的延伸。"
  - "本卡将 wallpaper 中已确认的东方美学、厚涂与丰富细节降权迁移到 illustration；空景、旧物、低饱和色与静态时间线索属于 AI 草拟方向，仍待用户确认。"
  - "广景与器物特写共用境物承载主题的逻辑；可随文章选取相应空间尺度，叙事线索由地点和物件的状态提供。"
  - 2026-10-19 用户审阅 AI 生成的 illustration 预览对照图（8 张）后确认本卡入库（选中第 6 张）
pending_confirmation:
  - "题材更常用山水建筑广景，还是器物特写与桌案静物？器物更偏日常使用品，还是礼器、古物或幻想器具？"
  - "人物比重更偏完全无人、极小剪影，还是可以看清正在使用器物的人物？"
  - "故事感更喜欢留有解读空间的日常痕迹，还是能明确看出离去、等待或重返等事件的布置？"
  - "色彩与时间感更偏低饱和青绿赭色、旧物包浆，还是鲜亮青绿、精致新物与更通透的日光？"
