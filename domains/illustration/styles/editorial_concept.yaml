name: 概念意象配图
domain: illustration
version: 1
summary: "以象征物及其关系表达文章主题，并按信息需要借用厚涂或极简线稿的视觉语言。"
use_when: 为关于方向、选择、记忆、边界或关系的文章与短文配图，文字重点是抽象观点、心理状态或主题关系，适合转译为视觉隐喻时。
likes:
  - item: "人物/环境/信息关系：倾向先提炼文章的主题关系，再选择象征物与空间条件；如以雾中灯塔及一道可追随的光表达迷茫中的方向，让信息决定画面主体。"
    weight: 0.55
    source: ai_drafted
    since: "2026-10-19"
  - item: "技法质感：通常可借国风厚涂的叠色、可见笔触与器物纹理，或借极简线稿的细线、排线与留白；同一隐喻可分别发展成两种质感版本。"
    weight: 0.45
    source: ai_drafted
    since: "2026-10-19"
  - item: "象征细节：倾向让磨损、裂缝、缠绕或修补痕迹参与含义，例如被接续的细线关联重新建立的联系，细节丰富程度围绕主题的可读性调整。"
    weight: 0.45
    source: ai_drafted
    since: "2026-10-19"
  - item: "色彩倾向：厚涂版本可用青灰、墨蓝与少量朱红或暖金，线稿版本可用黑白与低饱和点色；色彩重心通常落在承载转折或关系变化的象征物上。"
    weight: 0.4
    source: ai_drafted
    since: "2026-10-19"
  - item: "光照：倾向让光的来向参与隐喻，例如从远处灯塔向近处斜投一束偏暖的光，照亮冷灰雾中的局部路径；线稿版本可用光束区域的纸白与两侧排线表现相同的明暗关系。"
    weight: 0.45
    source: ai_drafted
    since: "2026-10-19"
  - item: "空间层次：通常以前景遮挡或边界、中景承担主题的象征物、远景留白或雾层组织阅读顺序，距离、大小与遮挡可按观点适度变形，空间关系服务于含义。"
    weight: 0.45
    source: ai_drafted
    since: "2026-10-19"
  - item: "故事感：倾向捕捉某种状态刚开始转变的瞬间，如雾中光路初现、断线刚被接上或封闭边界出现缺口，让时间感由主题的变化带出。"
    weight: 0.5
    source: ai_drafted
    since: "2026-10-19"
  - item: "主体选择：通常可由器物、几何关系或自然意象独立承担表达；人物可少可无，出现时可化为观察者或尺度参照，景物的取舍由象征关系主导。"
    weight: 0.45
    source: ai_drafted
    since: "2026-10-19"
dislikes: []
hard_constraints: []
soft_preferences: []
references_positive: []
references_negative: []
prompt_semantics: >-
  倾向先将文章主题转成可读的象征关系，再选择器物、几何关系或自然意象；例如用雾中灯塔与初现的光路表达迷茫中的方向，主体的距离、遮挡和尺度可随含义调整。技法质感通常可借国风厚涂的叠色、可见笔触与细密纹理，或借极简线稿的纤细轮廓、排线与留白。色彩上，厚涂版本可用青灰、墨蓝衬少量朱红或暖金，线稿版本可用黑白衬低饱和点色，视觉焦点落在主题发生转变的位置。光照可从远处象征物向近处斜投偏暖的光，照亮冷灰遮蔽中的一段路径；线稿版本用光路纸白与周边排线表达光向和亮暗，冷暖感可由局部点色提示。空间层次通常由前景遮挡或边界、中景主题象征物、远景留白或雾层形成，阅读顺序跟随主题关系。故事感倾向表现路径刚显露、联系刚接续或边界刚打开的转变瞬间。信息决定象征物及其关系，环境将抽象处境转成可见条件，人物可少可无，出现时通常作为观察者或尺度参照；具体意象与光线安排随文章主题变化。
notes:
  - "分类维度参考Art in Context（https://artincontext.org/types-of-illustration/），借用技法与用途分开组织的思路及编辑插画辅助文章观点的用途描述；本卡将象征表达作为用途变体，是本批的分类选择。"
  - "分类维度参考Adobe Spectrum（https://spectrum.adobe.com/foundations/visual-language/illustration），借用视觉注意力层级；厚涂版本可承担主视觉、线稿版本可承担段间辅助，是本批的应用推断。"
  - "本卡的概念意象指文章主题的视觉隐喻，与影视或游戏前期设定所用的概念设计分开理解；雾中灯塔是可替换的说明例子，题材随文章主题选择。"
  - "跨母系技法借用已降权；隐喻的直接程度、超现实程度与色彩取向为 AI 草拟，尚待用户确认。"
  - 2026-10-19 用户审阅 AI 生成的 illustration 预览对照图（8 张）后确认本卡入库（选中第 3 张）
pending_confirmation:
  - "希望隐喻一眼可懂，还是愿意接受需要结合正文解读的多义画面？"
  - "常配的文章更偏个人成长、情绪关系、文化评论还是技术观点？抽象几何与日常器物哪类象征更合意？"
  - "同一主题更希望先看国风厚涂版本、极简线稿版本，还是两种质感并列比较？"
  - "对尺度错置、漂浮器物和非写实空间的接受程度如何？人物倾向缺席、作为小剪影，还是偶尔成为象征本身？"
  - "主题转折更偏含蓄暧昧、冷静思辨还是带有希望感？点睛色更倾向朱红暖金还是低饱和冷色？"
