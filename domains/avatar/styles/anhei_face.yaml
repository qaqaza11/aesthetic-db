name: 暗黑厚涂·面部近景
domain: avatar
version: 1
summary: '深暗底色中的面部近景，以厚涂笔触、轮廓光和珠宝色细节呈现神秘力量感。'
use_when: 适合希望头像以强烈眼神、精致配饰和深暗氛围形成鲜明识别的场景。
