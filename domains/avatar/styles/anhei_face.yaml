dislikes: []
hard_constraints:
- 输出为 1:1 方形，边长不低于 1024px
- 主体面部与关键配饰位于画面中央圆形裁切安全区内
- 缩小显示时，面部与主体轮廓清晰可辨，避免细小文字和细碎背景细节喧宾夺主
soft_preferences: []
references_positive: []
references_negative: []
prompt_semantics: 深蓝灰或黑色底上的人物面部近景，背景接近纯暗色，以细窄轮廓光和清楚的面部明暗结构托出五官。采用可见笔触的厚涂油画质感，亮面保留颜料堆叠感，眼神与眼周细节精致。珠宝红、宝石绿或伞红以小面积出现在耳饰、发间珠宝或眼妆中，珠宝、金属与皮肤各有清楚的反光层次。人物神态沉着而有力量，整体神秘华丽，面部与关键配饰集中在中央圆形裁切安全区内。
notes:
- 分类维度参考Midlibrary（https://midlibrary.io/midjourney-styles-classifier）
- 分类维度参考Will Wulfken MJ词库（https://github.com/willwulfken/MidJourney-Styles-and-Keywords-Reference）
- 分类维度参考Stable Diffusion Art prompt指南（https://stable-diffusion-art.com/prompt-guide/）
- 分类维度参考Adobe Spectrum（https://spectrum.adobe.com/foundations/visual-language/illustration）
- 2026-10-19 用户审阅 AI 生成的 avatar 预览对照图（8 张）后确认本卡入库（选中第 2 张）
pending_confirmation:
- 人物更偏冷艳女性、俊美男性，还是带非人感的中性角色？
- 点缀色更偏珠宝红、宝石绿，还是接受红绿同时出现？
- 构图更偏正面直视、四分之三侧脸，还是微抬下颌的低视角？
- 面部阴影可以覆盖到什么程度：五官整体清楚，还是接受半张脸隐入暗处？
