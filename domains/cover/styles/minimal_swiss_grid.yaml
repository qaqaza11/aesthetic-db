name: 线序网格
domain: cover
version: 1
summary: "将克制线稿与网格化文字区结合，以无衬线排印、清晰层级和充足留白组织个人信息。"
use_when: 希望封面同时呈现昵称、身份或短句，适合重视信息清晰度的个人主页与创作者主页。
likes:
  - item: 倾向以隐形列网格组织画面，线稿占左侧较窄区域，右侧预留较宽文字区，图文边缘与文字基线形成清楚的对齐关系。
    weight: 0.6
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向采用无衬线字体，以字号和字重区分昵称、身份与短句，通常形成两至三级信息层级，文字块左对齐。
    weight: 0.6
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向以黑白细线稿和局部轻排线作为较低注意力的图形层，背景留白充足，文字周围保持完整空隙。
    weight: 0.6
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向将一处低饱和色用于短线、编号或小型图形，色彩与配套头像呼应，其余信息通常保持黑白关系。
    weight: 0.5
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向将核心文字列放在头像遮挡之外，以外围留白承担横向裁切；较窄版本通过网格重排保留信息层级。
    weight: 0.6
    source: ai_drafted
    since: "2026-10-19"
dislikes: []
hard_constraints:
  - "按目标平台分别记录交付宽高、裁切范围与界面遮挡模板；文字按对应安全区排版，并在实际显示尺寸下检查完整性与可读性。"
soft_preferences: []
references_positive: []
references_negative: []
prompt_semantics: "横向黑白极简封面，以隐形网格安排左侧细线稿与右侧清晰文字区；图形保持轻量，文字采用无衬线排印，通过字号、字重与间距建立阅读顺序。大面积纸白构成留白，一处低饱和色作小型定位标记。文字内容未定时保留空白网格区；按平台安全区移动或重排文字列，外围空白吸收裁切。"
notes:
  - "分类维度参考 BCcampus（https://opentextbc.ca/graphicdesign/chapter/1-6-its/）：借鉴网格、无衬线字体、非对称布局与清晰信息表达；与线稿结合属于本卡延伸。"
  - "分类维度参考 Looka（https://looka.com/blog/graphic-design-styles/）：借鉴留白、有限色板与网格等分类维度。"
  - 2026-10-19 用户审阅 AI 生成的 cover 预览对照图（7 张）后确认本卡入库（选中第 7 张）
pending_confirmation:
  - "封面需要呈现哪些文字，昵称、身份与短句的阅读优先级如何排列？"
  - "倾向左图右文还是左文右图，线稿与文字大约各占多少空间？"
  - "字体更偏中性理性还是略带人文感，点睛色希望用于文字还是图形？"
  - "目标平台及显示尺寸是什么，是否接受不同平台采用不同列数与换行方式？"
