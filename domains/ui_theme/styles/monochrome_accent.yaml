name: 黑白点睛
domain: ui_theme
version: 1
summary: "以黑白灰界面为主体，将单一高饱和点睛色放大为选中态、主要按钮与通知徽标等功能性强调，表面倾向纯平面。"
use_when: 适合试稿黑白灰手机主题，希望通过单一鲜明色彩提升交互焦点辨识度，并比较浅色与深色界面效果的场景。
likes:
  - item: 倾向以黑、白及中性灰组织背景、文字和分隔层级，让界面主体保持清晰的无彩色秩序。
    weight: 0.6
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向选择一种高饱和点睛色贯穿主要强调角色，使功能焦点具有一致的色彩识别。
    weight: 0.6
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向将点睛色用于图标选中态、主要按钮和通知徽标，让色彩承担可辨认的交互语义。
    weight: 0.58
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向让点睛色比单处装饰拥有更大的可见面积，并随当前任务分配强调强度。
    weight: 0.55
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向以纯平面色块、简洁线条和明确留白呈现组件，使表面处理接近 C1 的平面程度。
    weight: 0.54
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向在锁屏时间数字等信息焦点上试用同一点睛色，使锁屏与应用界面的视觉识别连贯。
    weight: 0.48
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向为成功、警告和错误建立独立的状态色角色，并配合文字或图形表达含义。
    weight: 0.5
    source: ai_drafted
    since: "2026-10-19"
dislikes: []
hard_constraints: []
soft_preferences:
  - 优先探索黑白灰主体与单一高饱和强调色的关系，具体色号及明度可随背景对比度调整。
  - 优先保证主要操作与选中状态的辨识度，点睛色面积可多可少，次要组件的参与程度留待确认。
  - 表面优先采用纯平面，是否加入极轻颗粒或雾面质感留待确认，质感优先级低于功能层级。
  - 黑底与白底可分别试稿，深浅模式下倾向延续同一强调色身份，并按可读性调整显示色值。
  - 状态色倾向与主题强调色分开配置，其覆盖范围与视觉强度留待确认。
references_positive: []
references_negative: []
prompt_semantics: >-
  E1＝黑白基底×单一高饱和点睛色×功能性强调。
  黑白灰承担界面主体与信息层级，一种高饱和强调色承担主要交互焦点，
  可覆盖图标选中态、主要按钮、通知徽标，并延伸至锁屏时间数字。
  相对 C1/C2，本卡点睛色饱和度更高、面积更大，从单处装饰扩展为主要交互语义；
  表面倾向与 C1 同级的纯平面，是否加入极轻质感留待确认。
  相对 B1，本卡主体仍为黑白灰，主题彩色倾向集中于一种强调色，
  与深蓝灰底及多色宝石组合形成区别。
  相对 D1，本卡以黑白基底与单一强调色建立识别，东方传统色板与东方意象均非构成依据，
  与深底、传统色板及宝石质感的组合形成区别。
  成功、警告、错误等状态色倾向作为独立语义层配置，其例外范围留待确认。
notes:
  - "分类来源参考：Interaction Design Foundation 的 Flat Design（https://www.interaction-design.org/literature/topics/flat-design）；借鉴的是平面程度与装饰负荷的维度思路，作为表面处理的讨论依据。"
  - "分类来源参考：Material Design 3 的 Color Roles（https://m3.material.io/styles/color/roles）；借鉴的是背景、内容、强调与状态等色彩角色的维度思路，具体配色仍待试稿确认。"
  - "创意假设来自壁纸领域极简线稿的点睛色思路，此处将局部视觉强调扩展为手机界面的功能性用色，尚待本领域验证。"
  - "单一强调色描述主题身份；独立状态色属于语义配置，若采用该方案，界面可能同时出现强调色与状态色。"
  - "本卡为 ui_theme 候选；壁纸偏好仅作假设来源，尚无本领域的用户确认。"
  - 2026-10-19 用户审阅 AI 生成的 ui_theme 预览对照图（8 张）后确认本卡入库（选中第 3 张）
pending_confirmation:
  - "点睛色倾向哪个具体色号，例如电光蓝 #2457FF、亮橙 #FF5A1F 或鲜紫 #8B3DFF？"
  - "界面主体更倾向白底、黑底，还是同时探索可切换的深浅两套方案？"
  - "成功、警告和错误是否采用独立状态色，并接受它们与主题点睛色同时出现？"
  - "点睛色参与交互的程度倾向多大：覆盖主要按钮与选中态，还是进一步延伸到通知徽标、开关、进度和锁屏时间数字？"
