name: 东方宝石混搭
domain: ui_theme
version: 2
summary: "以钢青深底承托丹紫红、海王绿、赤金三色焦点与简化东方意象，象牙白承载文字；图标走极简平面，大画幅（壁纸、锁屏、小组件）保留宝石氛围与东方意象的手机主题。"
use_when: 适用于东方色板深色主题的手机锁屏、桌面及组件试稿；图标设计须保持极简。
