name: 东方宝石混搭
domain: ui_theme
version: 1
summary: "以深色背景承托东方传统色焦点与简化东方意象，融合轻磨砂或微渐变，探索东方配色与暗色宝石氛围的手机主题。"
use_when: 适用于比较东方色板与深色宝石氛围融合效果的手机锁屏、桌面图标及组件试稿。
likes:
  - item: 倾向以深蓝灰或近黑色作为背景，让东方传统色焦点形成清晰的视觉层次。
    weight: 0.6
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向从绛紫、黛蓝、墨绿与金赭中探索焦点色，具体色号与饱和度留待确认。
    weight: 0.6
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向将相对高饱和的东方色用于图标选中态、时间数字或锁屏焦点图形，形成小面积的宝石般亮点。
    weight: 0.58
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向将云纹、回纹或团花简化为轮廓，集中呈现在焦点图形中。
    weight: 0.55
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向让轻磨砂或微渐变停留在背景氛围层，以接近 B2 的轻质感承托内容。
    weight: 0.56
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向以色彩明暗与局部饱和度表达宝石感，图标和按钮保持简洁的平面轮廓。
    weight: 0.54
    source: ai_drafted
    since: "2026-10-19"
  - item: 倾向保留充足的深色留白，让时间、状态信息与东方焦点图形各有清晰的位置。
    weight: 0.52
    source: ai_drafted
    since: "2026-10-19"
dislikes: []
hard_constraints: []
soft_preferences:
  - 优先探索深底与东方色焦点的面积关系，焦点占比可多可少，随信息密度调整。
  - 其次比较绛紫、黛蓝、墨绿与金赭的组合，单主色或双主色均可试稿，具体色号留待确认。
  - 东方意象的辨识度与复杂度可调，优先保留简化轮廓，再探索局部细节。
  - 背景磨砂颗粒与微渐变强度可调，优先照顾文字和图标的辨识度，再增加氛围。
references_positive: []
references_negative: []
prompt_semantics: >-
  D1＝东方传统色焦点×深底宝石质感×简化东方意象。
  倾向以深蓝灰或近黑色铺设背景，将绛紫、黛蓝、墨绿、金赭等候选色
  调整为相对高饱和且可辨识的小面积焦点，具体色号留待确认。
  相对 A1 东方平色与 A2 东方微纹，本卡倾向深色基底，
  东方色更多出现在图标选中态、时间数字与锁屏焦点图形，
  大面积东方色平涂的倾向较低，东方意象更多集中于局部焦点。
  相对 B1 宝石平色与 B2 宝石雾面，本卡倾向东方传统色板，
  通用宝石红绿的优先级较低，并通过云纹、回纹或团花的简化轮廓建立辨识度。
  质感强度倾向与 B2 同级，轻磨砂或微渐变作为背景氛围，
  重拟物与切面宝石按钮的倾向较低。
  相对 C1 黑白平线与 C2 黑白微纹，本卡更重视东方彩色焦点的饱和度与色相表达。
notes:
  - "分类来源参考：Interaction Design Foundation 的 Flat Design（https://www.interaction-design.org/literature/topics/flat-design）；借鉴的是平面表现与质感强度的维度思路，作为 A1/B1 与本卡的比较坐标。"
  - "分类来源参考：Material Design 的 Dark theme（https://m2.material.io/design/color/dark-theme.html）；借鉴的是深色表面、信息层级与强调色关系的维度思路，作为本卡深底与焦点配色的探索参考。"
  - "东方传统色名称在此作为候选方向，名称对应的色号、明度与饱和度留待确认；上述分类参考不代表用户偏好证据。"
  - "本卡为 ui_theme 候选；壁纸偏好仅作假设来源，尚无本领域的用户确认。"
  - 2026-10-19 用户审阅 AI 生成的 ui_theme 预览对照图（8 张）后确认本卡入库（选中第 7 张）
pending_confirmation:
  - "焦点主色更偏绛紫、黛蓝、墨绿还是金赭，具体色号更偏传统沉稳还是更鲜明的宝石感？"
  - "深底更偏近黑还是深蓝灰，背景质感更偏轻磨砂还是微渐变？"
  - "东方意象更偏云纹、回纹还是团花，辨识度更偏抽象暗示还是清晰可认？"
  - "首轮试稿更偏锁屏还是桌面，彩色焦点更希望落在时间数字、图标选中态还是主题图形？"
