hard_constraints: []
soft_preferences:
  - 五色面积关系首稿可试钢青约 80%、象牙白信息约 10%、丹紫红约 5%、海王绿约 3%、赤金约 2%，随信息密度调整；同屏倾向只选紫红或青绿之一作主彩色焦点。
  - 其次比较单主色与双主色的组合效果。
  - 东方意象的辨识度与复杂度可调，优先保留简化轮廓，再探索局部细节；但不进入图标。
  - 背景磨砂颗粒与微渐变强度可调，优先照顾文字和图标的辨识度，再增加氛围。
references_positive: []
references_negative: []
prompt_semantics: >-
  D1＝钢青深底×三色东方焦点×简化东方意象×图标极简。
  背景统一用钢青 #142334；丹紫红 #D2568C 作主焦点（选中态、时间数字、
  锁屏焦点图形），海王绿 #248067 作次焦点（次级标记、主题图标），
  赤金 #F2BE45 仅作少量高亮（徽标、重点数字、焦点轮廓），
  象牙白 #FFFBF0 为深底正文与信息文字基准。
  图标保持极简平面轮廓与干净字形、用色限单一功能色；
  云纹、回纹、团花的简化轮廓只出现在壁纸、锁屏焦点图形、小组件等大画幅，
  不进入图标与小尺寸控件。
  相对 A1 东方平色与 A2 东方微纹，本卡倾向深色基底，
  大面积东方色平涂的倾向较低，东方意象更多集中于局部焦点。
  相对 B1 宝石平色与 B2 宝石雾面，本卡倾向东方传统色板，
  通用宝石红绿的优先级较低，并通过简化东方意象轮廓建立辨识度。
  质感强度倾向与 B2 同级，轻磨砂或微渐变作为背景氛围，
  重拟物与切面宝石按钮的倾向较低。
  相对 C1 黑白平线与 C2 黑白微纹，本卡更重视东方彩色焦点的饱和度与色相表达。
notes:
  - "分类来源参考：Interaction Design Foundation 的 Flat Design（https://www.interaction-design.org/literature/topics/flat-design）；借鉴的是平面表现与质感强度的维度思路，作为 A1/B1 与本卡的比较坐标。"
  - "分类来源参考：Material Design 的 Dark theme（https://m2.material.io/design/color/dark-theme.html）；借鉴的是深色表面、信息层级与强调色关系的维度思路，作为本卡深底与焦点配色的探索参考。"
  - "色号来源：钢青/丹紫红/海王绿取自 zhongguose.com 数字色表（sRGB 试色值，未做 Adobe RGB→sRGB 转换）；赤金/象牙白取自 zerosoul/chinese-colors 手册 JSON；均非原书或国标认证值，记录时须带色名＋HEX＋来源版本。"
  - 2026-10-19 用户审阅 AI 生成的 ui_theme 预览对照图（8 张）后确认本卡入库（选中第 7 张）
  - 2026-10-19 用户拍板 P0-1：确认五色试稿（钢青 #142334＋丹紫红 #D2568C＋海王绿 #248067＋赤金 #F2BE45＋象牙白 #FFFBF0）；看了实机效果图后指出图标偏难看，决定图标走极简（干净字形＋单一功能色），东方意象与宝石丰富度只留给壁纸、锁屏、小组件等大画幅
